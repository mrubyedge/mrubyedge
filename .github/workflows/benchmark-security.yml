name: Benchmark security checks

on:
  pull_request:
    paths: ['benchmarks/**', '.github/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sandbox-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Audit reviewed dependency resolutions
        run: python benchmarks/audit_dependencies.py
      - name: Install hash-checked plotting wheels
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r benchmarks/requirements-plot.txt
      - name: Check adversarial inputs and publication
        run: python -m unittest discover -s benchmarks -p 'test_*.py'
      - name: Exercise isolation and historical/current builds
        env:
          BENCHMARK_REF: HEAD
          BASELINE_REF: v1.1.12
          BENCHMARK_CASES: integer
          BENCHMARK_MODE: warm
        run: |
          python benchmarks/sandbox.py --smoke --export "$RUNNER_TEMP/benchmark-report" \
            --expected "$RUNNER_TEMP/expected.json" --logs "$RUNNER_TEMP/benchmark-logs"
          python benchmarks/plot.py "$RUNNER_TEMP/benchmark-report/results.json" --metric time
          python benchmarks/plot.py "$RUNNER_TEMP/benchmark-report/results.json" --metric speedup
          python benchmarks/report.py "$RUNNER_TEMP/benchmark-report" \
            --expected "$RUNNER_TEMP/expected.json" --destination "$RUNNER_TEMP/verified-report"
      - name: Upload bounded diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: benchmark-security-diagnostics
          path: |
            ${{ runner.temp }}/benchmark-logs/
            ${{ runner.temp }}/verified-report/
          if-no-files-found: warn
          retention-days: 7
