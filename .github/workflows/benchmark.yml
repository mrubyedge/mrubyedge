name: Native VM benchmark

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'VM ref: SHA, tag/version, branch or HEAD (independent of workflow branch)'
        type: string
        required: true
        default: HEAD
      baseline_ref:
        description: 'Baseline VM ref; leave empty to measure only ref'
        type: string
        default: v1.1.12
      cases:
        description: 'Comma-separated workloads; empty means all'
        type: string
        default: ''
      mode:
        description: Measurement mode
        type: choice
        options: [both, cold, warm]
        default: both
      samples:
        description: 'Samples per workload/mode (1-100)'
        type: number
        default: 15
      features:
        description: 'Comma-separated VM features'
        type: string
        default: wasi
      default_features:
        description: 'Enable Cargo default features (includes mrubyedge-debug)'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      locks-reviewed: ${{ steps.measure.outputs.locks-reviewed }}
      expected: ${{ steps.measure.outputs.expected }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install plotting dependencies
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r benchmarks/requirements-plot.txt
      - name: Check benchmark tools
        run: python -m unittest discover -s benchmarks -p 'test_*.py'
      - name: Run selected VM revisions in isolation
        id: measure
        env:
          BENCHMARK_REF: ${{ inputs.ref }}
          BASELINE_REF: ${{ inputs.baseline_ref }}
          BENCHMARK_CASES: ${{ inputs.cases }}
          BENCHMARK_MODE: ${{ inputs.mode }}
          BENCHMARK_SAMPLES: ${{ inputs.samples }}
          BENCHMARK_FEATURES: ${{ inputs.features }}
          DEFAULT_FEATURES: ${{ inputs.default_features }}
        run: |
          python benchmarks/sandbox.py --export "$RUNNER_TEMP/benchmark-report" \
            --expected "$RUNNER_TEMP/benchmark-expected.json" --logs "$RUNNER_TEMP/benchmark-logs"
      - name: Generate and validate charts
        run: |
          python benchmarks/plot.py "$RUNNER_TEMP/benchmark-report/results.json" --metric time
          python benchmarks/plot.py "$RUNNER_TEMP/benchmark-report/results.json" --metric speedup
          python benchmarks/report.py "$RUNNER_TEMP/benchmark-report" \
            --expected "$RUNNER_TEMP/benchmark-expected.json" --destination "$RUNNER_TEMP/verified-report"
          cat "$RUNNER_TEMP/verified-report/results.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload verified report and charts
        id: report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: benchmark-report
          path: ${{ runner.temp }}/verified-report/
          if-no-files-found: error
          retention-days: 30
      - name: Link downloadable report
        env:
          REPORT_URL: ${{ steps.report.outputs.artifact-url }}
          LOCKS_REVIEWED: ${{ steps.measure.outputs.locks-reviewed }}
        run: |
          printf '\n[Download JSON, Markdown and PNG charts](%s)\n' "$REPORT_URL" >> "$GITHUB_STEP_SUMMARY"
          if [ "$LOCKS_REVIEWED" != true ]; then
            printf '\nPublication skipped: this dependency configuration has no reviewed lockfile.\n' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload bounded build logs and raw samples
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: benchmark-logs
          path: ${{ runner.temp }}/benchmark-logs/
          if-no-files-found: warn
          retention-days: 30

  publish-charts:
    needs: benchmark
    if: github.ref == 'refs/heads/master' && needs.benchmark.outputs.locks-reviewed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: benchmark-publication
    permissions:
      contents: write
    concurrency:
      group: benchmark-chart-publication
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: benchmark-report
          path: ${{ runner.temp }}/downloaded-report
      - name: Validate publication inputs
        env:
          EXPECTED_REPORT: ${{ needs.benchmark.outputs.expected }}
        run: |
          python -c 'import os; from pathlib import Path; Path(os.environ["RUNNER_TEMP"], "expected.json").write_text(os.environ["EXPECTED_REPORT"])'
          python benchmarks/report.py "$RUNNER_TEMP/downloaded-report" \
            --expected "$RUNNER_TEMP/expected.json" --destination "$RUNNER_TEMP/verified-report"
      - name: Prepare a bounded result snapshot
        run: |
          python benchmarks/publish.py prepare --repository "$GITHUB_REPOSITORY" \
            --report "$RUNNER_TEMP/verified-report" --state "$RUNNER_TEMP/benchmark-publication"
      - name: Push result snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python benchmarks/publish.py push --repository "$GITHUB_REPOSITORY" \
            --state "$RUNNER_TEMP/benchmark-publication"
      - name: Display published charts
        run: |
          python benchmarks/publish.py summary --repository "$GITHUB_REPOSITORY" \
            --report "$RUNNER_TEMP/verified-report" --state "$RUNNER_TEMP/benchmark-publication"
