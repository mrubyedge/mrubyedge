name: Deploy mrubyedge docs

on:
  push:
    branches: [ "master" ]
    paths: [ "mrubyedge/**", "docs/**", ".github/workflows/docs.yml" ]
  workflow_dispatch:
  pull_request:
    branches: [ "master" ]
    paths: [ "mrubyedge/**", "docs/**", ".github/workflows/docs.yml" ]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  doc:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
    - name: Run doc on mrubyedge
      run: cargo doc --no-deps -p mrubyedge
    - name: Copy root/docs
      run: cp -r docs/* target/doc/
    - name: Add redirect index.html
      run: |
        cat > target/doc/index.html <<'EOF'
        <!DOCTYPE html>
        <html>
          <head>
            <meta charset="utf-8">
            <meta http-equiv="refresh" content="0; url=mrubyedge/">
            <link rel="canonical" href="mrubyedge/">
          </head>
          <body>
            <p>Redirecting to <a href="mrubyedge/">mrubyedge documentation</a>...</p>
          </body>
        </html>
        EOF
    - name: Upload
      uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
      with:
        path: target/doc

  deploy:
     needs: doc
     if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master')
     concurrency:
       group: github-pages
       cancel-in-progress: false
     permissions:
       pages: write
       id-token: write
     environment:
       name: github-pages
       url: ${{ steps.deployment.outputs.page_url }}
     runs-on: ubuntu-latest
     steps:
       - name: Deploy to GitHub Pages
         id: deployment
         uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
