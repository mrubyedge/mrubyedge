name: Publish mruby spec report

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

# Serialize writes to the report repository and skip results from an older master.
concurrency:
  group: mruby-spec-publish
  cancel-in-progress: false

jobs:
  report:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.x'
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-spec-${{ hashFiles('**/Cargo.lock') }}
      - name: Generate HTML report
        shell: bash
        env:
          SOURCE_URL: https://github.com/${{ github.repository }}/blob/${{ github.sha }}/mrubyedge/tests/mruby_spec/upstream/t
        run: |
          rm -rf target/mruby-spec-site
          set +e
          python3 scripts/mruby_spec_report.py --format html \
            --output target/mruby-spec-site/index.html --source-url "$SOURCE_URL"
          result=$?
          set -e
          if [ "$result" -gt 1 ]; then
            exit "$result"
          fi
          test -s target/mruby-spec-site/index.html
          # Stable log paths avoid committing a new random directory each run.
          python3 - <<'PY'
          from pathlib import Path
          site = Path('target/mruby-spec-site')
          folders = list(site.glob('mruby-spec-logs-*'))
          assert len(folders) == 1, 'expected one report log directory'
          logs = folders[0]
          page = site / 'index.html'
          page.write_text(page.read_text().replace(logs.name + '/', 'logs/'))
          logs.rename(site / 'logs')
          (site / '.nojekyll').touch()
          PY
      - name: Check out report repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: mrubyedge/mruby-spec
          ref: main
          path: _spec_publish
          ssh-key: ${{ secrets.MRUBY_SPEC_DEPLOY_KEY }}
      - name: Publish report to mruby-spec
        shell: bash
        run: |
          source=$(git rev-parse HEAD)
          git fetch origin master
          if [ "$(git rev-parse origin/master)" != "$source" ]; then
            echo "::notice::Master advanced during reporting; the newer run will publish."
            exit 0
          fi
          rsync -a --delete target/mruby-spec-site/ _spec_publish/docs/
          git -C _spec_publish add -- docs
          if git -C _spec_publish diff --cached --quiet; then
            exit 0
          fi
          git -C _spec_publish config user.name 'github-actions[bot]'
          git -C _spec_publish config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C _spec_publish commit -m 'Update mruby spec report' \
            -m "Report source: https://github.com/mrubyedge/mrubyedge/commit/$source" \
            -m 'Co-authored-by: Codex <codex@openai.com>'
          git -C _spec_publish push origin HEAD:main
      - name: Upload report and logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mruby-spec-html
          path: target/mruby-spec-site/
          if-no-files-found: warn
          retention-days: 14
