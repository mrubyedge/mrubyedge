name: mruby-time CI

on:
  push:
    branches:
      - master
    paths:
      - 'mruby-time/**'
  pull_request:
    branches:
      - master
    paths:
      - 'mruby-time/**'

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        BUILD_TARGET: [release]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-time-${{ hashFiles('**/Cargo.lock') }}
      - name: Run formatter
        run: |
          cargo fmt -p mrubyedge-time --check
      - name: Run tests for "${{ matrix.BUILD_TARGET }}" profile
        run: |
          cargo test -p mrubyedge-time \
            --profile ${{ matrix.BUILD_TARGET }}
      - name: Build binaries for "${{ matrix.BUILD_TARGET }}" profile
        run: |
          cargo build -p mrubyedge-time \
            --profile ${{ matrix.BUILD_TARGET }}
